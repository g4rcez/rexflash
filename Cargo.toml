[package]
name = "rexflash"
version = "0.2.0"
edition = "2024"
description = "Hint and flash-style label picker for Rex terminal panes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/g4rcez/rexflash"
homepage = "https://github.com/g4rcez/rexflash"
keywords = ["rex", "terminal", "hints", "flash"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
